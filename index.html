<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepared — Survive with taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text: #111110;
      --muted: #999994;
      --border-line: rgba(0,0,0,0.09);
      --rule-color: rgba(0,0,0,0.09);
      --btn-border: rgba(0,0,0,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      background: #fff;
      color: var(--text);
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Topbar ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 0;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeDown 0.6s ease 0.1s forwards;
      position: relative;
      z-index: 50;
    }

    .site-name {
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: var(--text);
      text-decoration: none;
      user-select: none;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── View toggle (switch) ── */
    .view-toggle-wrap {
      padding: 0 40px 32px;
    }

    body.is-carousel .hero,
    body.is-carousel .rule,
    body.is-carousel .grid-wrapper { display: none !important; }

    .view-toggle {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--btn-border);
      border-radius: 100px;
      padding: 3px;
      gap: 0;
      background: #fff;
    }

    .view-toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      height: calc(100% - 6px);
      background: var(--text);
      border-radius: 100px;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.25s;
      pointer-events: none;
    }

    .vtbtn {
      position: relative;
      z-index: 1;
      padding: 5px 12px;
      background: transparent;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      font-family: 'Google Sans', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.25s;
      white-space: nowrap;
    }

    .vtbtn.active { color: #fff; }

    /* ── War conflict button ── */
    .war-btn {
      font-family: 'Google Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--btn-border);
      padding: 7px 14px;
      cursor: pointer;
      background: transparent;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .war-btn:hover { text-decoration: underline; }

    .war-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: none; }
    .war-dot.red   { background: #e53535; display: block; }
    .war-dot.green { background: #22a854; display: block; }

    /* ── War panel ── */
    .war-panel {
      position: fixed;
      top: 64px;
      right: 40px;
      width: 272px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .war-panel.open { display: flex; }

    .war-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-line);
    }

    .war-panel-title {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .war-panel-close {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px;
      transition: color 0.15s;
    }
    .war-panel-close:hover { color: var(--text); }

    .war-geo {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; border-bottom: 1px solid var(--border-line);
      cursor: pointer; font-size: 12px; font-weight: 400; color: var(--text);
      background: none; border-left: none; border-right: none; border-top: none;
      font-family: 'Google Sans', sans-serif; width: 100%; text-align: left;
      transition: none;
    }
    .war-geo:hover { text-decoration: underline; }
    .war-geo svg { flex-shrink: 0; opacity: 0.5; }

    .war-search-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border-line); }

    .war-search {
      width: 100%; border: 1px solid var(--border-line);
      padding: 7px 10px; font-family: 'Google Sans', sans-serif;
      font-size: 12px; font-weight: 300; color: var(--text); outline: none;
      background: #fafafa; transition: border-color 0.15s;
    }
    .war-search:focus { border-color: rgba(0,0,0,0.3); background: #fff; }
    .war-search::placeholder { color: var(--muted); }

    .war-list { max-height: 220px; overflow-y: auto; overscroll-behavior: contain; }
    .war-list::-webkit-scrollbar { width: 4px; }
    .war-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); }

    .war-country-item {
      display: block; width: 100%; padding: 9px 16px; text-align: left;
      background: none; border: none; font-family: 'Google Sans', sans-serif;
      font-size: 12.5px; font-weight: 300; color: var(--text); cursor: pointer;
    }
    .war-country-item:hover { text-decoration: underline; }
    .war-empty { padding: 16px; font-size: 12px; color: var(--muted); text-align: center; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: var(--text);
      color: #fff;
      padding: 13px 20px;
      font-size: 12.5px;
      font-weight: 300;
      line-height: 1.45;
      max-width: min(400px, calc(100vw - 40px));
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 300;
      pointer-events: none;
      white-space: pre-line;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0px); }

    /* ── Hero ── */
    .hero { padding: 76px 40px 56px; }

    .hero-headline {
      font-weight: 300;
      font-size: clamp(54px, 8.5vw, 100px);
      line-height: 1.0;
      letter-spacing: -0.015em;
      color: var(--text);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    .hero-sub {
      font-weight: 300;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.025em;
      max-width: 340px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease 0.45s forwards;
    }

    /* ── Rule ── */
    .rule {
      height: 1px; background: var(--rule-color); margin: 0 40px;
      opacity: 0; animation: fadeIn 0.5s ease 0.55s forwards;
    }

    /* ── Grid ── */
    .grid-wrapper { padding: 0 40px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(0,0,0,0.07);
    }

    /* ── Card ── */
    .card {
      display: flex; flex-direction: column;
      background: #fff; text-decoration: none; color: var(--text);
      opacity: 0; transform: translateY(22px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .card.visible { opacity: 1; transform: translateY(0); }

    .card-image {
      aspect-ratio: 1/1; background: #fff;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }

    .card-image img {
      width: 80%; height: 80%; object-fit: contain;
      transition: transform 0.38s ease; display: block;
    }
    .card:hover .card-image img { transform: scale(1.05); }

    .card-info {
      border-top: 1px solid var(--border-line);
      padding: 13px 16px 15px;
      display: flex; flex-direction: column; gap: 3px;
    }

    .card-brand {
      font-size: 9px; font-weight: 400; letter-spacing: 0.13em;
      text-transform: uppercase; color: var(--muted);
    }

    .card-name { font-weight: 400; font-size: 15px; line-height: 1.2; color: var(--text); margin-top: 1px; }

    .card-price {
      font-size: 12px; font-weight: 300; color: var(--muted);
      letter-spacing: 0.01em; margin-top: 9px;
    }

    /* ── Footer ── */
    footer {
      padding: 30px 40px 36px;
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 1px; opacity: 0; animation: fadeUp 0.5s ease 0.7s forwards;
    }
    .footer-left { font-size: 10.5px; font-weight: 300; color: var(--muted); letter-spacing: 0.01em; }
    .footer-right { font-size: 12px; font-weight: 300; color: var(--muted); }

    /* ── Animations ── */
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeDown { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }

    @keyframes btnShake {
      0%,100% { transform: translateX(0); }
      15%  { transform: translateX(-5px); }
      30%  { transform: translateX(5px); }
      45%  { transform: translateX(-4px); }
      60%  { transform: translateX(4px); }
      75%  { transform: translateX(-2px); }
      90%  { transform: translateX(2px); }
    }
    @keyframes btnExplode {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      10%  { transform: translate(-4px,2px) rotate(-4deg) scale(1.06); opacity: 1; }
      20%  { transform: translate(6px,-3px) rotate(6deg) scale(0.94); opacity: 1; }
      35%  { transform: translate(-8px,5px) rotate(-12deg) scale(1.1); opacity: 0.85; }
      50%  { transform: translate(10px,-7px) rotate(18deg) scale(0.85); opacity: 0.65; }
      65%  { transform: translate(-14px,9px) rotate(-28deg) scale(0.6); opacity: 0.4; }
      80%  { transform: translate(18px,-12px) rotate(40deg) scale(0.3); opacity: 0.15; }
      100% { transform: translate(0,0) rotate(0deg) scale(0); opacity: 0; }
    }
    @keyframes btnRebuild {
      0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
      55%  { transform: scale(1.12) rotate(2deg); opacity: 0.9; }
      80%  { transform: scale(0.95) rotate(-1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .war-btn--shake   { animation: btnShake   0.5s ease; }
    .war-btn--explode { animation: btnExplode 0.9s ease forwards; }
    .war-btn--rebuild { animation: btnRebuild 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    /* ─────────────────────────────────────────────
       CAROUSEL VIEW
    ───────────────────────────────────────────── */
    .carousel-section {
      display: none;
      position: relative;
      overflow: hidden;
      flex: 1;
      min-height: 0;
    }

    body.is-carousel .carousel-section { display: flex; }
    body.is-carousel footer { display: none; }
    body.is-carousel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Background giant text */
    .c-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .c-bg-word {
      font-size: clamp(100px, 18vw, 220px);
      font-weight: 400;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0,0,0,0.055);
      user-select: none;
      transition: opacity 0.5s ease;
    }

    /* Left info panel */
    .c-info {
      position: relative;
      z-index: 10;
      width: 42%;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 52px 48px 40px;
      flex-shrink: 0;
    }

    .c-label {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      transition: opacity 0.3s;
    }

    .c-name {
      font-size: clamp(32px, 3.8vw, 56px);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -0.025em;
      color: var(--text);
      margin-bottom: 22px;
      transition: opacity 0.3s;
    }

    .c-desc {
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 310px;
      margin-bottom: 28px;
      min-height: 3.4em;
      transition: opacity 0.3s;
    }

    .c-price {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 28px;
      transition: opacity 0.3s;
    }

    .c-bottom {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .c-buy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--text);
      padding: 9px 16px;
      transition: background 0.18s, color 0.18s;
    }
    .c-buy:hover { background: var(--text); color: #fff; }

    .c-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .c-nav-btn {
      width: 34px; height: 34px;
      border: 1px solid var(--btn-border);
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      transition: background 0.18s, border-color 0.18s, color 0.18s;
    }
    .c-nav-btn:hover { background: var(--text); border-color: var(--text); color: #fff; }

    .c-counter {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--muted);
      min-width: 48px;
      text-align: center;
    }

    /* Right stage: 3D fan */
    .c-stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1600px;
      perspective-origin: 50% 50%;
      z-index: 5;
    }

    .c-card {
      position: absolute;
      width: 258px;
      height: 390px;
      background: #fff;
      border: 1px solid #111;
      transition:
        transform 0.65s cubic-bezier(0.4, 0, 0.2, 1),
        opacity   0.65s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      will-change: transform, opacity;
      transform-origin: center center;
    }

    .c-card-img {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .c-card-img img {
      width: 100%; height: 100%; object-fit: contain;
      display: block;
    }

    .c-card-foot {
      padding: 12px 14px;
      flex-shrink: 0;
    }
    .c-card-brand {
      font-size: 8px; font-weight: 400; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px;
    }
    .c-card-name { font-size: 12.5px; font-weight: 400; color: var(--text); line-height: 1.2; }

    /* Fade class for info transitions */
    .c-info.fading .c-label,
    .c-info.fading .c-name,
    .c-info.fading .c-desc,
    .c-info.fading .c-price { opacity: 0; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 640px) {
      .topbar { padding: 20px 20px 0; }
      .war-btn { font-size: 9px; padding: 5px 10px; letter-spacing: 0.04em; }
      .war-panel { right: 20px; width: calc(100vw - 40px); }
      .hero { padding: 48px 20px 40px; }
      .rule { margin: 0 20px; }
      .grid-wrapper { padding: 0 20px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .view-toggle-wrap { padding: 0 20px 24px; }
      .card-image { padding: 12px; }
      .card-image img { width: 100%; height: 100%; }
      footer { padding: 24px 20px 30px; }

      /* Carousel mobile: stack vertically */
      .carousel-section { flex-direction: column; }
      .c-info {
        width: 100%; min-width: unset;
        padding: 24px 20px 16px;
        flex-shrink: 0;
        order: 2;
      }
      .c-name { font-size: 26px; margin-bottom: 10px; }
      .c-desc { display: none; }
      .c-price { font-size: 16px; margin-bottom: 16px; }
      .c-stage { order: 1; flex: 1; min-height: 0; }
      .c-card { width: 180px; height: 270px; }
      .c-bg-word { font-size: 18vw; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <span class="site-name">Prepared</span>
    <div class="topbar-right">
      <button class="war-btn" id="warBtn" onclick="toggleWarPanel()">
        <span class="war-dot" id="warDot"></span>Check war conflict
      </button>
    </div>
  </div>

  <!-- War conflict panel -->
  <div class="war-panel" id="warPanel">
    <div class="war-panel-header">
      <span class="war-panel-title">Conflict risk by country</span>
      <button class="war-panel-close" onclick="closeWarPanel()">&#x2715;</button>
    </div>
    <button class="war-geo" onclick="geolocateUser()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
      Use my location
    </button>
    <div class="war-search-wrap">
      <input class="war-search" id="warSearch" type="text" placeholder="Search country…" oninput="filterCountries(this.value)" autocomplete="off">
    </div>
    <div class="war-list" id="warList"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Hero -->
  <div class="hero">
    <h1 class="hero-headline">Survive<br>with taste.</h1>
    <p class="hero-sub">A curated selection of objects that hold their own — in the wild and in the world.</p>
  </div>

  <!-- View toggle -->
  <div class="view-toggle-wrap">
    <div class="view-toggle" id="viewToggle">
      <div class="view-toggle-slider" id="vtSlider"></div>
      <button class="vtbtn active" id="btnGrid" onclick="setView('grid')">List</button>
      <button class="vtbtn" id="btnCarousel" onclick="setView('carousel')">Experiential</button>
    </div>
  </div>

  <!-- Divider -->
  <div class="rule"></div>

  <!-- Product grid -->
  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Carousel view -->
  <div class="carousel-section" id="carouselSection">
    <!-- Giant background text -->
    <div class="c-bg"><span class="c-bg-word" id="cBgWord"></span></div>

    <!-- Info panel -->
    <div class="c-info" id="cInfo">
      <span class="c-label" id="cLabel"></span>
      <div class="c-name" id="cName"></div>
      <div class="c-desc" id="cDesc"></div>
      <div class="c-price" id="cPrice"></div>
      <div class="c-bottom">
        <a class="c-buy" id="cBuy" href="#" target="_blank" rel="noopener noreferrer sponsored">Shop ↗</a>
        <div class="c-nav">
          <button class="c-nav-btn" onclick="carouselPrev()">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M7.78 13.03a.75.75 0 0 1-1.06 0L2.47 8.78a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L5 7.5h7.25a.75.75 0 0 1 0 1.5H5l2.78 2.97a.75.75 0 0 1 0 1.06Z"/>
            </svg>
          </button>
          <span class="c-counter" id="cCounter">01 / 01</span>
          <button class="c-nav-btn" onclick="carouselNext()">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 1 1-1.06-1.06L11 8.5H3.75a.75.75 0 0 1 0-1.5H11L8.22 4.03a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 3D stage -->
    <div class="c-stage" id="cStage"></div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer-left">Links de afiliación</span>
    <span class="footer-right" id="footerCount">15 objects · 2025</span>
  </footer>

  <script>
    // ── Google Sheets CMS ─────────────────────────────────────────
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmXG7dixDMOBwhTSpi_2YYINQNLdlwwlEamm5p35MYxatowf2aNOvmbi2LxGZk9_51V8ScE12GIY_0/pub?gid=0&single=true&output=csv';

    const fallbackProducts = [

    // ── CSV parser ────────────────────────────────────────────────
    function splitCSVRow(row) {
      const result = []; let cur = '', inQ = false;
      for (let i = 0; i < row.length; i++) {
        if (row[i] === '"') { inQ = !inQ; }
        else if (row[i] === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
        else { cur += row[i]; }
      }
      result.push(cur.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = splitCSVRow(lines[0]);
      return lines.slice(1).filter(l => l.trim())
        .map(line => Object.fromEntries(headers.map((h, i) => [h, splitCSVRow(line)[i] || ''])));
    }

    // ── Price formatter ───────────────────────────────────────────
    function formatPrice(raw) {
      const num = parseFloat(String(raw).replace(/[€$\s]/g, '').replace(',', '.'));
      if (isNaN(num)) return raw;
      return num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
    }

    // ── Grid render ───────────────────────────────────────────────
    function renderGrid(products) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      products.forEach((p) => {
        const card = document.createElement('a');
        card.href = p.url || '#'; card.target = '_blank';
        card.rel  = 'noopener noreferrer sponsored';
        card.className = 'card';
        card.innerHTML = `
          <div class="card-image">
            <img src="${p.image}" alt="${p.brand} ${p.name}" loading="lazy" width="400" height="400">
          </div>
          <div class="card-info">
            <span class="card-brand">${p.brand}</span>
            <span class="card-name">${p.name}</span>
            <span class="card-price">${formatPrice(p.price)}</span>
          </div>`;
        grid.appendChild(card);
      });

      document.getElementById('footerCount').textContent = `${products.length} objects · 2025`;

      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          const c = e.target;
          c.style.transitionDelay = `${(parseInt(c.dataset.index) % 4) * 0.07}s`;
          c.classList.add('visible');
          obs.unobserve(c);
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.card').forEach((c, i) => { c.dataset.index = i; obs.observe(c); });
    }

    // ── View toggle ───────────────────────────────────────────────
    let currentView = 'grid';

    function setView(v) {
      currentView = v;
      document.body.classList.toggle('is-carousel', v === 'carousel');
      const btnGrid  = document.getElementById('btnGrid');
      const btnExp   = document.getElementById('btnCarousel');
      const slider   = document.getElementById('vtSlider');
      btnGrid.classList.toggle('active', v === 'grid');
      btnExp.classList.toggle('active',  v === 'carousel');
      const activeBtn = v === 'grid' ? btnGrid : btnExp;
      slider.style.width     = activeBtn.offsetWidth + 'px';
      slider.style.transform = `translateX(${activeBtn.offsetLeft - 3}px)`;
      if (v === 'carousel' && allProducts.length) {
        buildCarouselCards();
        updateCarousel();
      }
    }

    // Init slider position after layout
    window.addEventListener('load', () => setView('grid'));

    // ── Carousel ──────────────────────────────────────────────────
    let allProducts = [];
    let carouselIndex = 0;

    const CARD_STATES = {
      '-3': { tx: -480, tz: -500, ry: 40, sc: 0.5,  op: 0 },
      '-2': { tx: -330, tz: -300, ry: 28, sc: 0.68, op: 0.25 },
      '-1': { tx: -185, tz: -120, ry: 16, sc: 0.84, op: 0.65 },
       '0': { tx:    0, tz:    0, ry:  0, sc: 1,    op: 1 },
       '1': { tx:  185, tz: -120, ry:-16, sc: 0.84, op: 0.65 },
       '2': { tx:  330, tz: -300, ry:-28, sc: 0.68, op: 0.25 },
       '3': { tx:  480, tz: -500, ry:-40, sc: 0.5,  op: 0 },
    };

    function cardState(rel) {
      const key = Math.max(-3, Math.min(3, rel));
      return CARD_STATES[String(key)];
    }

    function buildCarouselCards() {
      const stage = document.getElementById('cStage');
      stage.innerHTML = '';
      allProducts.forEach((p, i) => {
        const el = document.createElement('div');
        el.className = 'c-card';
        el.dataset.idx = i;
        el.innerHTML = `
          <div class="c-card-img">
            <img src="${p.image}" alt="${p.name}" loading="lazy">
          </div>
          <div class="c-card-foot">
            <span class="c-card-brand">${p.brand}</span>
            <span class="c-card-name">${p.name}</span>
          </div>`;
        el.addEventListener('click', () => {
          const n = allProducts.length;
          let diff = i - carouselIndex;
          if (diff >  n / 2) diff -= n;
          if (diff < -n / 2) diff += n;
          if (diff === 1)  carouselNext();
          else if (diff === -1) carouselPrev();
        });
        stage.appendChild(el);
      });
    }

    function updateCarousel(fade) {
      const n = allProducts.length;
      if (!n) return;
      const p = allProducts[carouselIndex];

      if (fade) {
        const info = document.getElementById('cInfo');
        info.classList.add('fading');
        setTimeout(() => {
          fillInfo(p, n);
          info.classList.remove('fading');
        }, 220);
      } else {
        fillInfo(p, n);
      }

      // Position cards
      document.querySelectorAll('.c-card').forEach((card, i) => {
        let rel = i - carouselIndex;
        if (rel >  n / 2) rel -= n;
        if (rel < -n / 2) rel += n;
        const s = cardState(rel);
        card.style.transform = `translateX(${s.tx}px) translateZ(${s.tz}px) rotateY(${s.ry}deg) scale(${s.sc})`;
        card.style.opacity   = s.op;
        card.style.zIndex    = 10 - Math.abs(rel);
        card.style.pointerEvents = Math.abs(rel) <= 1 ? 'auto' : 'none';
      });
    }

    function fillInfo(p, n) {
      document.getElementById('cLabel').textContent   = p.brand;
      document.getElementById('cName').textContent    = p.name;
      document.getElementById('cDesc').textContent    = p.description || '';
      document.getElementById('cPrice').textContent   = formatPrice(p.price);
      document.getElementById('cBuy').href            = p.url || '#';
      document.getElementById('cCounter').textContent =
        String(carouselIndex + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0');
      const bg = document.getElementById('cBgWord');
      bg.style.opacity = '0';
      setTimeout(() => {
        bg.textContent   = p.brand;
        bg.style.opacity = '1';
      }, 200);
    }

    function carouselNext() {
      carouselIndex = (carouselIndex + 1) % allProducts.length;
      updateCarousel(true);
    }

    function carouselPrev() {
      carouselIndex = (carouselIndex - 1 + allProducts.length) % allProducts.length;
      updateCarousel(true);
    }

    // Keyboard
    document.addEventListener('keydown', e => {
      if (currentView !== 'carousel') return;
      if (e.key === 'ArrowRight') carouselNext();
      if (e.key === 'ArrowLeft')  carouselPrev();
    });

    // Touch swipe
    let _tx = 0;
    document.getElementById('cStage').addEventListener('touchstart', e => { _tx = e.touches[0].clientX; }, { passive: true });
    document.getElementById('cStage').addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - _tx;
      if (Math.abs(dx) > 48) { if (dx < 0) carouselNext(); else carouselPrev(); }
    });

    // ── Load ──────────────────────────────────────────────────────
    async function init() {
      let products = fallbackProducts;
      if (!SHEET_CSV_URL.startsWith('PEGA_AQUI')) {
        try {
          const res = await fetch(SHEET_CSV_URL);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = parseCSV(await res.text());
          if (data.length) products = data;
        } catch (err) {
          console.warn('Using fallback products.', err);
        }
      }
      allProducts = products;
      renderGrid(products);
    }

    init();

    const allCountries = Object.keys(CONFLICT_RISK).sort();
    let toastTimer = null;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast';
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 5500);
    }

    function checkConflict(country) {
      const key = allCountries.find(c => c === country) ||
                  allCountries.find(c => c.toLowerCase() === country.toLowerCase());
      if (!key) { showToast(`"${country}" not found in our database.`); return; }
      const risk = CONFLICT_RISK[key];
      const dot  = document.getElementById('warDot');
      const btn  = document.getElementById('warBtn');
      dot.className = 'war-dot ' + (risk > 50 ? 'red' : 'green');
      closeWarPanel();

      // Reset any ongoing animation
      btn.classList.remove('war-btn--shake', 'war-btn--explode', 'war-btn--rebuild');
      void btn.offsetWidth;

      if (risk > 50) {
        showToast(`${key} — conflict probability above 50%\nStay alert and prepared.`);
        btn.classList.add('war-btn--explode');
        setTimeout(() => {
          btn.classList.remove('war-btn--explode');
          btn.style.visibility = 'hidden';
        }, 900);
        setTimeout(() => {
          btn.style.visibility = '';
          btn.classList.add('war-btn--rebuild');
          setTimeout(() => btn.classList.remove('war-btn--rebuild'), 600);
        }, 3000);
      } else {
        showToast(`${key} — conflict probability below 50%\nSituation currently stable.`);
        btn.classList.add('war-btn--shake');
        setTimeout(() => btn.classList.remove('war-btn--shake'), 500);
      }
    }

    function renderCountryList(filter) {
      const list = document.getElementById('warList');
      const q    = (filter || '').toLowerCase();
      const hits = allCountries.filter(c => c.toLowerCase().includes(q));
      if (!hits.length) { list.innerHTML = '<div class="war-empty">No countries found</div>'; return; }
      list.innerHTML = hits.map(c =>
        `<button class="war-country-item" onclick="checkConflict('${c.replace(/'/g, "\\'")}')">${c}</button>`
      ).join('');
    }

    function filterCountries(v) { renderCountryList(v); }

    function toggleWarPanel() {
      document.getElementById('warPanel').classList.contains('open') ? closeWarPanel() : openWarPanel();
    }

    function openWarPanel() {
      document.getElementById('warPanel').classList.add('open');
      document.getElementById('warSearch').value = '';
      renderCountryList('');
      setTimeout(() => document.getElementById('warSearch').focus(), 50);
    }

    function closeWarPanel() { document.getElementById('warPanel').classList.remove('open'); }

    document.addEventListener('click', e => {
      const panel = document.getElementById('warPanel');
      const btn   = document.getElementById('warBtn');
      if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn && !btn.contains(e.target))
        closeWarPanel();
    });

    async function geolocateUser() {
      if (!navigator.geolocation) { showToast('Geolocation not supported by your browser.'); return; }
      showToast('Detecting your location…');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const { latitude, longitude } = pos.coords;
            const res  = await fetch(
              `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`,
              { headers: { 'Accept-Language': 'en' } }
            );
            const data = await res.json();
            const country = data.address && data.address.country;
            if (!country) throw new Error();
            checkConflict(country);
          } catch { showToast('Could not identify your country. Please select manually.'); }
        },
        () => showToast('Location access denied. Please select your country manually.')
      );
    }
