<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepared — Survive with taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #111110;
      --muted: #999994;
      --border-line: rgba(0, 0, 0, 0.09);
      --rule-color: rgba(0, 0, 0, 0.09);
      --btn-border: rgba(0, 0, 0, 0.15);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: var(--text);
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 0;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeDown 0.6s ease 0.1s forwards;
    }

    .site-name {
      font-family: 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: var(--text);
      text-decoration: none;
      user-select: none;
    }

    /* ── War conflict button ── */
    .war-btn {
      font-family: 'Google Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      border: 1px solid var(--btn-border);
      padding: 7px 14px;
      cursor: pointer;
      background: transparent;
      white-space: nowrap;
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .war-btn:hover {
      text-decoration: underline;
    }

    .war-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      display: none;
    }

    .war-dot.red  { background: #e53535; display: block; }
    .war-dot.green { background: #22a854; display: block; }

    /* ── War panel ── */
    .war-panel {
      position: fixed;
      top: 64px;
      right: 40px;
      width: 272px;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      z-index: 200;
      display: none;
      flex-direction: column;
    }

    .war-panel.open {
      display: flex;
    }

    .war-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border-line);
    }

    .war-panel-title {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .war-panel-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
      transition: color 0.15s;
    }

    .war-panel-close:hover {
      color: var(--text);
    }

    .war-geo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-line);
      cursor: pointer;
      font-size: 12px;
      font-weight: 400;
      color: var(--text);
      transition: background 0.15s;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      font-family: 'Google Sans', sans-serif;
      width: 100%;
      text-align: left;
    }

    .war-geo:hover {
      text-decoration: underline;
    }

    .war-geo svg {
      flex-shrink: 0;
      opacity: 0.5;
    }

    .war-search-wrap {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-line);
    }

    .war-search {
      width: 100%;
      border: 1px solid var(--border-line);
      padding: 7px 10px;
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--text);
      outline: none;
      background: #fafafa;
      transition: border-color 0.15s;
    }

    .war-search:focus {
      border-color: rgba(0,0,0,0.3);
      background: #fff;
    }

    .war-search::placeholder {
      color: var(--muted);
    }

    .war-list {
      max-height: 220px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .war-list::-webkit-scrollbar {
      width: 4px;
    }

    .war-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .war-list::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.12);
    }

    .war-country-item {
      display: block;
      width: 100%;
      padding: 9px 16px;
      text-align: left;
      background: none;
      border: none;
      font-family: 'Google Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 300;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s;
    }

    .war-country-item:hover {
      text-decoration: underline;
    }

    .war-empty {
      padding: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      background: var(--text);
      color: #ffffff;
      padding: 13px 20px;
      font-family: 'Google Sans', sans-serif;
      font-size: 12.5px;
      font-weight: 300;
      line-height: 1.45;
      max-width: min(400px, calc(100vw - 40px));
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 300;
      pointer-events: none;
      white-space: pre-line;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0px);
    }

    .toast.high {
      background: #1a1a1a;
    }

    .toast.low {
      background: #111110;
    }

    /* ── Hero ── */
    .hero {
      padding: 76px 40px 56px;
    }

    .hero-headline {
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(54px, 8.5vw, 100px);
      line-height: 1.0;
      letter-spacing: -0.015em;
      color: var(--text);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    .hero-sub {
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.025em;
      max-width: 340px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease 0.45s forwards;
    }

    /* ── Rule ── */
    .rule {
      height: 1px;
      background: var(--rule-color);
      margin: 0 40px;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.55s forwards;
    }

    /* ── Grid ── */
    .grid-wrapper {
      padding: 0 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(0, 0, 0, 0.07);
    }

    /* ── Card ── */
    .card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      text-decoration: none;
      color: var(--text);
      transition: background 0.22s ease;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.55s ease, transform 0.55s ease, background 0.22s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Image area */
    .card-image {
      aspect-ratio: 1 / 1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-image img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      transition: transform 0.38s ease;
      display: block;
    }

    .card:hover .card-image img {
      transform: scale(1.05);
    }

    /* Info area */
    .card-info {
      border-top: 1px solid var(--border-line);
      padding: 13px 16px 15px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-brand {
      font-family: 'Google Sans', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-name {
      font-family: 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.2;
      color: var(--text);
      margin-top: 1px;
    }

    .card-price {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
      margin-top: 9px;
    }

    /* ── Footer ── */
    footer {
      padding: 30px 40px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.7s forwards;
    }

    .footer-left {
      font-size: 10.5px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .footer-right {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 20px 20px 0;
      }

      .war-btn {
        display: none;
      }

      .war-panel {
        right: 20px;
        width: calc(100vw - 40px);
      }

      .hero {
        padding: 48px 20px 40px;
      }

      .rule {
        margin: 0 20px;
      }

      .grid-wrapper {
        padding: 0 20px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .card-image {
        padding: 12px;
      }

      .card-image img {
        width: 100%;
        height: 100%;
      }

      footer {
        padding: 24px 20px 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <span class="site-name">Prepared</span>
    <button class="war-btn" id="warBtn" onclick="toggleWarPanel()">
      <span class="war-dot" id="warDot"></span>Check war conflict
    </button>
  </div>

  <!-- War conflict panel -->
  <div class="war-panel" id="warPanel">
    <div class="war-panel-header">
      <span class="war-panel-title">Conflict risk by country</span>
      <button class="war-panel-close" onclick="closeWarPanel()">&#x2715;</button>
    </div>
    <button class="war-geo" onclick="geolocateUser()">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
      Use my location
    </button>
    <div class="war-search-wrap">
      <input class="war-search" id="warSearch" type="text" placeholder="Search country…" oninput="filterCountries(this.value)" autocomplete="off">
    </div>
    <div class="war-list" id="warList"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Hero -->
  <div class="hero">
    <h1 class="hero-headline">Survive<br>with taste.</h1>
    <p class="hero-sub">A curated selection of objects that hold their own — in the wild and in the world.</p>
  </div>

  <!-- Divider -->
  <div class="rule"></div>

  <!-- Product grid -->
  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer-left">Links de afiliación</span>
    <span class="footer-right">15 objects · 2025</span>
  </footer>

  <script>
    // ── Google Sheets CMS ─────────────────────────────────────────
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmXG7dixDMOBwhTSpi_2YYINQNLdlwwlEamm5p35MYxatowf2aNOvmbi2LxGZk9_51V8ScE12GIY_0/pub?gid=0&single=true&output=csv';

    // ── Fallback products ─────────────────────────────────────────
    const fallbackProducts = [
      { brand: 'Leatherman',    name: 'Signal',                 price: '€109', url: 'https://www.amazon.com/dp/B07NJHX769', image: 'https://picsum.photos/seed/leatherman-signal/400/400'   },
      { brand: 'Grayl',         name: 'GeoPress 24 oz',         price: '€78',  url: 'https://www.amazon.com/dp/B07NVYR4P9', image: 'https://picsum.photos/seed/grayl-geopress/400/400'      },
      { brand: 'Garmin',        name: 'inReach Mini 2',         price: '€349', url: 'https://www.amazon.com/dp/B09BFTWX5F', image: 'https://picsum.photos/seed/garmin-inreach/400/400'      },

    ];

    // ── CSV parser ────────────────────────────────────────────────
    function splitCSVRow(row) {
      const result = [];
      let cur = '', inQ = false;
      for (let i = 0; i < row.length; i++) {
        if (row[i] === '"') { inQ = !inQ; }
        else if (row[i] === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
        else { cur += row[i]; }
      }
      result.push(cur.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = splitCSVRow(lines[0]);
      return lines.slice(1)
        .filter(l => l.trim())
        .map(line => Object.fromEntries(headers.map((h, i) => [h, splitCSVRow(line)[i] || ''])));
    }

    // ── Render ────────────────────────────────────────────────────

    function formatPrice(raw) {
      const num = parseFloat(String(raw).replace(/[€$\s]/g, '').replace(',', '.'));
      if (isNaN(num)) return raw;
      return num.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '€';
    }

    function renderGrid(products) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      products.forEach((p) => {
        const card = document.createElement('a');
        card.href      = p.url || '#';
        card.target    = '_blank';
        card.rel       = 'noopener noreferrer sponsored';
        card.className = 'card';
        card.innerHTML = `
          <div class="card-image">
            <img src="${p.image}" alt="${p.brand} ${p.name}" loading="lazy" width="400" height="400">
          </div>
          <div class="card-info">
            <span class="card-brand">${p.brand}</span>
            <span class="card-name">${p.name}</span>
            <span class="card-price">${formatPrice(p.price)}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelector('.footer-right').textContent = `${products.length} objects · 2025`;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const card = entry.target;
          const col  = parseInt(card.dataset.index, 10) % 4;
          card.style.transitionDelay = `${col * 0.07}s`;
          card.classList.add('visible');
          observer.unobserve(card);
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.card').forEach((card, i) => {
        card.dataset.index = i;
        observer.observe(card);
      });
    }

    // ── Load ──────────────────────────────────────────────────────
    async function init() {
      if (SHEET_CSV_URL.startsWith('PEGA_AQUI')) {
        renderGrid(fallbackProducts);
        return;
      }
      try {
        const res  = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = parseCSV(await res.text());
        renderGrid(data);
      } catch (err) {
        console.warn('No se pudo cargar Google Sheets, usando datos locales.', err);
        renderGrid(fallbackProducts);
      }
    }

    init();

      'Turkey': 28,
      'Turkmenistan': 15,
      'Uganda': 22,
      'Ukraine': 91,
      'United Arab Emirates': 10,
      'United Kingdom': 7,
      'United States': 12,
      'Uruguay': 5,
      'Uzbekistan': 12,
      'Venezuela': 36,
      'Vietnam': 10,
      'Yemen': 80,
      'Zambia': 8,
      'Zimbabwe': 30,
    };

    const allCountries = Object.keys(CONFLICT_RISK).sort();
    let toastTimer = null;

    function showToast(msg, level) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + (level || '');
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 5500);
    }

    function checkConflict(countryName) {
      const name = countryName.trim();
      // Try exact match first, then case-insensitive
      const key = allCountries.find(c => c === name) ||
                  allCountries.find(c => c.toLowerCase() === name.toLowerCase());
      if (!key) {
        showToast(`Country "${name}" not found in our database.`, '');
        return;
      }
      const risk = CONFLICT_RISK[key];
      const dot = document.getElementById('warDot');
      dot.className = 'war-dot ' + (risk > 50 ? 'red' : 'green');
      closeWarPanel();
      if (risk > 50) {
        showToast(`${key}\nConflict probability above 50% — stay alert and prepared.`, 'high');
      } else {
        showToast(`${key}\nConflict probability below 50% — situation currently stable.`, 'low');
      }
    }

    function renderCountryList(filter) {
      const list = document.getElementById('warList');
      const q = (filter || '').toLowerCase();
      const matches = allCountries.filter(c => c.toLowerCase().includes(q));
      if (!matches.length) {
        list.innerHTML = '<div class="war-empty">No countries found</div>';
        return;
      }
      list.innerHTML = matches
        .map(c => `<button class="war-country-item" onclick="checkConflict('${c.replace(/'/g, "\\'")}')">${c}</button>`)
        .join('');
    }

    function filterCountries(val) {
      renderCountryList(val);
    }

    function toggleWarPanel() {
      const panel = document.getElementById('warPanel');
      if (panel.classList.contains('open')) {
        closeWarPanel();
      } else {
        openWarPanel();
      }
    }

    function openWarPanel() {
      const panel = document.getElementById('warPanel');
      panel.classList.add('open');
      document.getElementById('warSearch').value = '';
      renderCountryList('');
      setTimeout(() => document.getElementById('warSearch').focus(), 50);
    }

    function closeWarPanel() {
      document.getElementById('warPanel').classList.remove('open');
    }

    // Close panel when clicking outside
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('warPanel');
      const btn   = document.getElementById('warBtn');
      if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) {
        closeWarPanel();
      }
    });

    async function geolocateUser() {
      if (!navigator.geolocation) {
        showToast('Geolocation is not supported by your browser.', '');
        return;
      }
      showToast('Detecting your location…', '');
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const { latitude, longitude } = pos.coords;
            const res  = await fetch(
              `https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`,
              { headers: { 'Accept-Language': 'en' } }
            );
            const data = await res.json();
            const country = data.address && (data.address.country);
            if (!country) throw new Error('no country');
            checkConflict(country);
          } catch {
            showToast('Could not determine your country. Please select manually.', '');
          }
        },
        () => {
          showToast('Location access denied. Please select your country manually.', '');
        }
      );
    }
  </script>

</body>
