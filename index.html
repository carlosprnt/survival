<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepared — Survive with taste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #111110;
      --muted: #999994;
      --border-line: rgba(0, 0, 0, 0.09);
      --rule-color: rgba(0, 0, 0, 0.09);
      --btn-border: rgba(0, 0, 0, 0.15);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: var(--text);
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px 0;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeDown 0.6s ease 0.1s forwards;
    }

    .site-name {
      font-family: 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: var(--text);
      text-decoration: none;
      user-select: none;
    }

    /* ── Hero ── */
    .hero {
      padding: 76px 40px 56px;
    }

    .hero-headline {
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(54px, 8.5vw, 100px);
      line-height: 1.0;
      letter-spacing: -0.015em;
      color: var(--text);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.7s ease 0.25s forwards;
    }

    .hero-sub {
      font-family: 'Google Sans', sans-serif;
      font-weight: 300;
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 0.025em;
      max-width: 340px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease 0.45s forwards;
    }

    /* ── Rule ── */
    .rule {
      height: 1px;
      background: var(--rule-color);
      margin: 0 40px;
      opacity: 0;
      animation: fadeIn 0.5s ease 0.55s forwards;
    }

    /* ── Grid ── */
    .grid-wrapper {
      padding: 0 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(0, 0, 0, 0.07);
    }

    /* ── Card ── */
    .card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      text-decoration: none;
      color: var(--text);
      transition: background 0.22s ease;
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.55s ease, transform 0.55s ease, background 0.22s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      background: #f9f9f9;
    }

    /* Image area */
    .card-image {
      aspect-ratio: 1 / 1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.22s ease;
    }

    .card:hover .card-image {
      background: #f9f9f9;
    }

    .card-image img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      opacity: 0.82;
      transition: transform 0.38s ease, opacity 0.38s ease;
      display: block;
    }

    .card:hover .card-image img {
      transform: scale(1.04) translateY(-3px);
      opacity: 1;
    }

    /* Info area */
    .card-info {
      border-top: 1px solid var(--border-line);
      padding: 13px 16px 15px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-brand {
      font-family: 'Google Sans', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-name {
      font-family: 'Google Sans', sans-serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.2;
      color: var(--text);
      margin-top: 1px;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
    }

    .card-price {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .card-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--btn-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.22s ease, border-color 0.22s ease;
    }

    .card-btn svg {
      color: var(--text);
      transition: color 0.22s ease;
    }

    .card:hover .card-btn {
      background: var(--text);
      border-color: var(--text);
    }

    .card:hover .card-btn svg {
      color: #ffffff;
    }

    /* ── Footer ── */
    footer {
      padding: 30px 40px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.7s forwards;
    }

    .footer-left {
      font-size: 10.5px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .footer-right {
      font-family: 'Google Sans', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--muted);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 20px 20px 0;
      }

      .hero {
        padding: 48px 20px 40px;
      }

      .rule {
        margin: 0 20px;
      }

      .grid-wrapper {
        padding: 0 20px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .card-image img {
        width: 100%;
        height: 100%;
      }

      footer {
        padding: 24px 20px 30px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <span class="site-name">Prepared</span>
  </div>

  <!-- Hero -->
  <div class="hero">
    <h1 class="hero-headline">Survive<br>with taste.</h1>
    <p class="hero-sub">A curated selection of objects that hold their own — in the wild and in the world.</p>
  </div>

  <!-- Divider -->
  <div class="rule"></div>

  <!-- Product grid -->
  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer-left">Links de afiliación</span>
    <span class="footer-right">15 objects · 2025</span>
  </footer>

  <script>
    // ── Google Sheets CMS ─────────────────────────────────────────
    // Pasos para configurar:
    // 1. Crea una Google Sheet con estas columnas (fila 1 = cabeceras):
    //    brand | name | price | url | image
    // 2. Rellena tus productos (image = URL de Cloudinary u otro host)
    // 3. Archivo → Compartir → Publicar en la web → Hoja1 → CSV → Publicar
    // 4. Copia la URL y pégala abajo
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmXG7dixDMOBwhTSpi_2YYINQNLdlwwlEamm5p35MYxatowf2aNOvmbi2LxGZk9_51V8ScE12GIY_0/pub?gid=0&single=true&output=csv';

    // ── Fallback: productos por defecto ───────────────────────────
    const fallbackProducts = [
      { brand: 'Leatherman',    name: 'Signal',                 price: '€109', url: 'https://www.amazon.com/dp/B07NJHX769', image: 'https://picsum.photos/seed/leatherman-signal/400/400'   },
      { brand: 'Grayl',         name: 'GeoPress 24 oz',         price: '€78',  url: 'https://www.amazon.com/dp/B07NVYR4P9', image: 'https://picsum.photos/seed/grayl-geopress/400/400'      },
      { brand: 'Garmin',        name: 'inReach Mini 2',         price: '€349', url: 'https://www.amazon.com/dp/B09BFTWX5F', image: 'https://picsum.photos/seed/garmin-inreach/400/400'      },
      { brand: 'Morakniv',      name: 'Garberg Carbon',         price: '€89',  url: 'https://www.amazon.com/dp/B01LW2HL5G', image: 'https://picsum.photos/seed/morakniv-garberg/400/400'    },
      { brand: 'Nitecore',      name: 'NU31',                   price: '€49',  url: 'https://www.amazon.com/dp/B09Q5PQTP7', image: 'https://picsum.photos/seed/nitecore-nu31/400/400'       },
      { brand: 'MSR',           name: 'Hubba Hubba NX 2P',      price: '€550', url: 'https://www.amazon.com/dp/B07T3MFLFL', image: 'https://picsum.photos/seed/msr-hubba/400/400'           },
      { brand: 'Therm-a-Rest',  name: 'NeoAir XLite NXT',       price: '€199', url: 'https://www.amazon.com/dp/B09NRFP4W8', image: 'https://picsum.photos/seed/thermarest-neoair/400/400'  },
      { brand: 'MSR',           name: 'PocketRocket 2',         price: '€45',  url: 'https://www.amazon.com/dp/B01N5N5SBW', image: 'https://picsum.photos/seed/msr-pocketrocket/400/400'   },
      { brand: 'Sawyer',        name: 'Squeeze Filter',         price: '€32',  url: 'https://www.amazon.com/dp/B00FA2IXBU', image: 'https://picsum.photos/seed/sawyer-squeeze/400/400'     },
      { brand: 'Goal Zero',     name: 'Nomad 10',               price: '€59',  url: 'https://www.amazon.com/dp/B07FC1M7XV', image: 'https://picsum.photos/seed/goalzero-nomad/400/400'     },
      { brand: 'Anker',         name: 'PowerCore 26800',        price: '€65',  url: 'https://www.amazon.com/dp/B01M5AX9J3', image: 'https://picsum.photos/seed/anker-powercore/400/400'    },
      { brand: 'Light My Fire', name: 'Swedish FireSteel Army', price: '€16',  url: 'https://www.amazon.com/dp/B0019IXVRO', image: 'https://picsum.photos/seed/lightmyfire-steel/400/400'  },
      { brand: 'Sea to Summit', name: 'Spark SP I Down',        price: '€280', url: 'https://www.amazon.com/dp/B07WDTJMC9', image: 'https://picsum.photos/seed/seatosummit-spark/400/400'  },
      { brand: 'ESEE',          name: 'ESEE-4',                 price: '€145', url: 'https://www.amazon.com/dp/B003MXF3TC', image: 'https://picsum.photos/seed/esee-four/400/400'          },
      { brand: 'Victorinox',    name: 'Swiss Army Huntsman',    price: '€29',  url: 'https://www.amazon.es/dp/B0013VAHIA',  image: 'https://picsum.photos/seed/victorinox-huntsman/400/400'},
    ];

    // ── CSV parser ────────────────────────────────────────────────
    function splitCSVRow(row) {
      const result = [];
      let cur = '', inQ = false;
      for (let i = 0; i < row.length; i++) {
        if (row[i] === '"') { inQ = !inQ; }
        else if (row[i] === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
        else { cur += row[i]; }
      }
      result.push(cur.trim());
      return result;
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = splitCSVRow(lines[0]);
      return lines.slice(1)
        .filter(l => l.trim())
        .map(line => Object.fromEntries(headers.map((h, i) => [h, splitCSVRow(line)[i] || ''])));
    }

    // ── Render ────────────────────────────────────────────────────
    const arrowSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 16 16" fill="currentColor">
      <path d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L11 8.5H3.75a.75.75 0 0 1 0-1.5H11L8.22 4.03a.75.75 0 0 1 0-1.06Z"/>
    </svg>`;

    function renderGrid(products) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      products.forEach((p) => {
        const card = document.createElement('a');
        card.href      = p.url || '#';
        card.target    = '_blank';
        card.rel       = 'noopener noreferrer sponsored';
        card.className = 'card';
        card.innerHTML = `
          <div class="card-image">
            <img src="${p.image}" alt="${p.brand} ${p.name}" loading="lazy" width="400" height="400">
          </div>
          <div class="card-info">
            <span class="card-brand">${p.brand}</span>
            <span class="card-name">${p.name}</span>
            <div class="card-bottom">
              <span class="card-price">${p.price}</span>
              <span class="card-btn" aria-hidden="true">${arrowSVG}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.querySelector('.footer-right').textContent = `${products.length} objects · 2025`;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          const card = entry.target;
          const col  = parseInt(card.dataset.index, 10) % 4;
          card.style.transitionDelay = `${col * 0.07}s`;
          card.classList.add('visible');
          observer.unobserve(card);
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.card').forEach((card, i) => {
        card.dataset.index = i;
        observer.observe(card);
      });
    }

    // ── Load ──────────────────────────────────────────────────────
    async function init() {
      if (SHEET_CSV_URL.startsWith('PEGA_AQUI')) {
        renderGrid(fallbackProducts);
        return;
      }
      try {
        const res  = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = parseCSV(await res.text());
        renderGrid(data);
      } catch (err) {
        console.warn('No se pudo cargar Google Sheets, usando datos locales.', err);
        renderGrid(fallbackProducts);
      }
    }

    init();
  </script>

</body>
</html>
